<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O-ASIS // 隆中ハイエンド・アーカイヴ</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600&family=Cinzel:wght@400;600&display=swap');

    :root {
      --bg-luxury: radial-gradient(circle at 50% 0%, #141624 0%, #07080d 65%, #020305 100%);
      --glass-surface: rgba(18, 20, 32, 0.55);
      --glass-border: rgba(255, 255, 255, 0.06);
      --glass-border-hover: rgba(192, 132, 252, 0.25);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-glow: linear-gradient(135deg, #818cf8 0%, #c084fc 50%, #f472b6 100%);
    }

    body {
      background: var(--bg-luxury);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 48px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      letter-spacing: 0.02em;
    }

    header { text-align: center; margin-bottom: 36px; }
    h1 {
      font-family: 'Cinzel', serif;
      font-size: 2.2rem;
      letter-spacing: 10px;
      margin: 0 0 8px 0;
      font-weight: 400;
      background: var(--accent-glow);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 40px rgba(192, 132, 252, 0.2);
    }
    .subtitle {
      font-size: 0.65rem;
      letter-spacing: 6px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 300;
    }

    .tab-container {
      display: flex;
      width: 100%;
      max-width: 540px;
      margin-bottom: 28px;
      background: rgba(8, 9, 14, 0.7);
      backdrop-filter: blur(30px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 6px;
      box-sizing: border-box;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .tab-btn {
      flex: 1;
      padding: 12px 4px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      font-size: 0.65rem;
      letter-spacing: 2px;
      border-radius: 12px;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .tab-btn:hover { color: var(--text-main); background: rgba(255, 255, 255, 0.02); }
    .tab-btn.active {
      background: rgba(255, 255, 255, 0.06);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .card {
      background: var(--glass-surface);
      backdrop-filter: blur(36px);
      -webkit-backdrop-filter: blur(36px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 32px 28px;
      width: 100%;
      max-width: 540px;
      margin-bottom: 24px;
      box-sizing: border-box;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.9rem;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.3s;
    }

    input:focus {
      border-color: rgba(192, 132, 252, 0.5);
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: var(--accent-glow);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 2px;
      cursor: pointer;
      transition: opacity 0.3s, transform 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .hidden {
      display: none !important;
    }

    .user-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--glass-border);
    }

    .btn-logout {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>O-ASIS</h1>
    <div class="subtitle">隆中ハイエンド・アーカイヴ</div>
  </header>

  <!-- ログインフォーム -->
  <div id="auth-section" class="card">
    <div class="input-group">
      <label for="auth-name">USER NAME</label>
      <input type="text" id="auth-name" placeholder="名前を入力">
    </div>
    <div class="input-group">
      <label for="auth-pass">PASSWORD</label>
      <input type="password" id="auth-pass" placeholder="パスワードを入力">
    </div>
    <button class="btn" onclick="handleLogin()">AUTHENTICATE</button>
  </div>

  <!-- ログイン後の画面 -->
  <div id="main-section" class="hidden" style="width: 100%; max-width: 540px;">
    
    <div class="user-info">
      <span>Logged in as: <strong id="user-display"></strong> <span id="admin-badge" style="color: #c084fc; font-size: 0.75rem; margin-left: 8px;"></span></span>
      <button class="btn-logout" onclick="logout()">LOGOUT</button>
    </div>

    <div class="tab-container">
      <button class="tab-btn active" onclick="switchTab(event, 'tab1')">ARCHIVE</button>
      <button class="tab-btn" onclick="switchTab(event, 'tab2')">SYSTEM</button>
    </div>

    <div id="tab1" class="card">
      <h3>アーカイヴ・データ</h3>
      <p style="color: var(--text-muted); font-size: 0.85rem;">サーバー認証が成功しました。ここにコンテンツを表示できます。</p>
    </div>

    <div id="tab2" class="card hidden">
      <h3>システムステータス</h3>
      <p style="color: var(--text-muted); font-size: 0.85rem;">GASサーバー通信状態：正常</p>
    </div>

  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbx-SJ2DJZuQw-vyr9-_hhV8JyGiA3-Ob7sj-9_fw-C1FHqu8HVa-ISuH7OusQURtNep4g/exec';

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[m]));
    }

    function handleLogin() {
      const nameInput = document.getElementById('auth-name');
      const passInput = document.getElementById('auth-pass');

      if (!nameInput || !passInput) return;

      const name = nameInput.value.trim();
      const pass = passInput.value.trim();

      if (!name || !pass) {
        alert('名前とパスワードを入力してください。');
        return;
      }

      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'login',
          name: name,
          pass: pass
        })
      })
      .then(res => res.json())
      .then(resData => {
        if (resData.status === 'success') {
          const currentUser = {
            name: name,
            isAdmin: resData.isAdmin
          };
          
          localStorage.setItem('o_asis_session', JSON.stringify(currentUser));
          initSession();
        } else {
          alert('認証に失敗しました。');
        }
      })
      .catch(err => {
        console.error('通信エラー:', err);
        alert('サーバーとの通信に失敗しました。');
      });
    }

    function initSession() {
      const sessionData = localStorage.getItem('o_asis_session');
      const authSection = document.getElementById('auth-section');
      const mainSection = document.getElementById('main-section');
      const userDisplay = document.getElementById('user-display');
      const adminBadge = document.getElementById('admin-badge');

      if (sessionData) {
        try {
          const user = JSON.parse(sessionData);
          userDisplay.textContent = escapeHtml(user.name);
          adminBadge.textContent = user.isAdmin ? '[ADMIN]' : '[USER]';
          
          authSection.classList.add('hidden');
          mainSection.classList.remove('hidden');
        } catch(e) {
          logout();
        }
      } else {
        authSection.classList.remove('hidden');
        mainSection.classList.add('hidden');
      }
    }

    function logout() {
      localStorage.removeItem('o_asis_session');
      document.getElementById('auth-name').value = '';
      document.getElementById('auth-pass').value = '';
      initSession();
    }

    function switchTab(e, tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      e.currentTarget.classList.add('active');
      
      document.getElementById('tab1').classList.add('hidden');
      document.getElementById('tab2').classList.add('hidden');
      document.getElementById(tabId).classList.remove('hidden');
    }

    document.addEventListener('DOMContentLoaded', initSession);
  </script>
</body>
</html>
