<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O-asis</title>
  <style>
    :root {
      --bg-color: #080a0f;
      --card-bg: rgba(18, 22, 31, 0.75);
      --accent-color: #c084fc;
      --accent-hover: #a855f7;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: rgba(192, 132, 252, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px 12px;
    }

    .container {
      width: 100%;
      max-width: 680px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 2rem;
      letter-spacing: 2px;
      color: var(--accent-color);
      margin-bottom: 6px;
    }

    .user-info {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    .btn-logout {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      cursor: pointer;
    }

    /* 認証エリア */
    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(10px);
    }

    input, textarea {
      width: 100%;
      background: rgba(4, 5, 8, 0.6);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      outline: none;
      font-size: 0.9rem;
    }

    input:focus, textarea:focus {
      border-color: var(--accent-color);
    }

    button {
      width: 100%;
      background: var(--accent-color);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--accent-hover);
    }

    .hidden {
      display: none !important;
    }

    /* メインコンテンツ */
    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab-btn {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .tab-btn.active {
      background: var(--accent-color);
      color: #000;
      font-weight: bold;
      border-color: var(--accent-color);
    }

    .card {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: blur(10px);
    }

    .card.active {
      display: block;
    }

    /* タイムライン */
    .post-card {
      background: rgba(4, 5, 8, 0.4);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .comments-section {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed var(--border-color);
    }

    .comment-item {
      background: rgba(255, 255, 255, 0.03);
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 0.8rem;
    }

    .comment-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    /* ギャラリー */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }

    .gallery-item {
      background: rgba(4, 5, 8, 0.5);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
    }

    .gallery-image {
      width: 100%;
      height: 120px;
      object-fit: cover;
      display: block;
    }

    .gallery-info {
      padding: 6px;
      font-size: 0.7rem;
      text-align: center;
      color: var(--text-muted);
    }

    /* DM */
    .box-bubble {
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      font-size: 0.85rem;
    }

    .box-bubble.guest {
      background: rgba(4, 5, 8, 0.6);
      border: 1px solid var(--border-color);
    }

    .box-bubble.admin {
      background: rgba(192, 132, 252, 0.1);
      border: 1px solid var(--accent-color);
    }

    /* モーダル */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      max-width: 500px;
      width: 100%;
      padding: 16px;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 10px; right: 14px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      width: auto;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: var(--text-muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>O-asis</h1>
      <div id="user-display-area" class="user-info">
        <span id="user-display"></span>
        <span id="admin-badge" style="color:var(--accent-color);"></span>
        <button class="btn-logout" onclick="logout()">LOGOUT</button>
      </div>
    </header>

    <!-- 認証セッション -->
    <div id="auth-section" class="auth-card">
      <h2 style="font-size:1.1rem; margin-bottom:14px; text-align:center;">LOGIN</h2>
      <input type="text" id="auth-name" placeholder="ユーザー名">
      <input type="password" id="auth-pass" placeholder="パスワード">
      <button onclick="handleLogin()">ログイン</button>
    </div>

    <!-- メインコンテンツ -->
    <div id="main-section" class="hidden">
      <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('home', event)">HOME</button>
        <button class="tab-btn" onclick="switchTab('timeline', event)">TIMELINE</button>
        <button class="tab-btn" onclick="switchTab('gallery', event)">GALLERY</button>
        <button class="tab-btn" onclick="switchTab('dm', event)">DM</button>
      </div>

      <!-- HOME -->
      <div id="tab-home" class="card active">
        <h3 style="font-size:0.9rem; color:var(--accent-color); margin-bottom:10px;">STATUS</h3>
        <p id="current-status-text" style="margin-bottom:14px; font-weight:300;"></p>
        <input type="text" id="status-input" placeholder="ステータス更新 (ローカル保存)">
        <button onclick="updateStatusText()" style="margin-bottom:20px;">更新</button>

        <h3 style="font-size:0.9rem; color:var(--accent-color); margin-bottom:10px;">DISCORD</h3>
        <button onclick="copyDiscord()">Discord ID をコピー</button>
      </div>

      <!-- TIMELINE -->
      <div id="tab-timeline" class="card">
        <div style="margin-bottom:20px; background:rgba(4,5,8,0.5); padding:12px; border-radius:10px; border:1px solid var(--border-color);">
          <input type="text" id="new-post-author" placeholder="投稿名">
          <textarea id="new-post-text" placeholder="いまどうしてる？" rows="3"></textarea>
          <input type="text" id="new-post-image" placeholder="画像URL (任意)">
          <button onclick="addNewPost()">投稿する</button>
        </div>
        <div id="timeline-container"></div>
      </div>

      <!-- GALLERY -->
      <div id="tab-gallery" class="card">
        <div id="gallery-container"></div>
      </div>

      <!-- DM -->
      <div id="tab-dm" class="card">
        <div id="dm-guest-section">
          <div id="dm-login-box">
            <h3 style="font-size:0.9rem; color:var(--accent-color); margin-bottom:10px;">暗号通信 (ゲスト送信)</h3>
            <input type="text" id="dm-name" placeholder="お名前">
            <input type="password" id="dm-birthday" placeholder="暗証番号 (誕生日など)">
            <textarea id="dm-message" placeholder="メッセージを入力..." rows="3"></textarea>
            <button onclick="sendAndOpenDm()">送信 / スレッドを開く</button>
          </div>

          <div id="dm-chat-box" style="display:none;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
              <span id="current-dm-info" style="font-size:0.75rem; color:var(--accent-color);"></span>
              <button onclick="closeDmChat()" style="width:auto; padding:4px 10px; font-size:0.7rem;">戻る</button>
            </div>
            <div id="dm-messages" style="max-height:300px; overflow-y:auto; margin-bottom:10px; padding-right:4px;"></div>
            <form onsubmit="sendDmReply(event)" style="display:flex; gap:6px;">
              <input type="text" id="dm-reply-msg" placeholder="返信..." style="margin-bottom:0;">
              <button type="submit" style="width:auto; padding:0 16px;">送信</button>
            </form>
          </div>

          <hr style="border:none; border-top:1px solid var(--border-color); margin:20px 0;">
          <input type="password" id="admin-passkey" placeholder="管理者用パスキー">
          <button onclick="loginAsAdmin()" style="background:transparent; border:1px solid var(--border-color); color:var(--text-muted);">管理者ログイン</button>
        </div>

        <div id="admin-dashboard" style="display:none;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
            <h3 style="font-size:0.9rem; color:var(--accent-color);">DM ADMIN DASHBOARD</h3>
            <button onclick="logoutAdmin()" style="width:auto; padding:4px 10px; font-size:0.7rem;">ログアウト</button>
          </div>
          <div id="admin-messages-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 画像モーダル -->
  <div id="image-modal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <img id="modal-img" src="" style="width:100%; border-radius:8px; margin-bottom:10px;">
      <div id="modal-title" style="font-weight:bold; font-size:0.9rem; color:var(--accent-color);"></div>
      <div id="modal-desc" style="font-size:0.8rem; color:var(--text-muted); margin-top:4px;"></div>
    </div>
  </div>

  <script>
    // ログイン認証用GASとDM機能用GASのURL設定
    const AUTH_GAS_URL = "https://script.google.com/macros/s/AKfycbx-SJ2DJZuQw-vyr9-_hhV8JyGiA3-Ob7sj-9_fw-C1FHqu8HVa-ISuH7OusQURtNep4g/exec";
    const DM_GAS_URL = "https://script.google.com/macros/s/AKfycbyL7hDxmO3DJdg0XWCCtQBlZSMPT4SKNx3xlCDnOhJ60uSa2wExSzOkRSyrYMBrPvMAxw/exec";

    let currentBirthday = "";
    let currentName = "";
    let audioCtx = null;

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    // 認証セッション管理
    function handleLogin() {
      const nameInput = document.getElementById('auth-name');
      const passInput = document.getElementById('auth-pass');

      if (!nameInput || !passInput) return;

      const name = nameInput.value.trim();
      const pass = passInput.value.trim();

      if (!name || !pass) {
        alert('名前とパスワードを入力してください。');
        return;
      }

      fetch(AUTH_GAS_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'login',
          name: name,
          pass: pass
        })
      })
      .then(res => res.json())
      .then(resData => {
        if (resData.status === 'success') {
          const currentUser = {
            name: name,
            isAdmin: resData.isAdmin
          };
          localStorage.setItem('o_asis_session', JSON.stringify(currentUser));
          initSession();
        } else {
          alert('認証に失敗しました。');
        }
      })
      .catch(err => {
        console.error('通信エラー:', err);
        alert('サーバーとの通信に失敗しました。');
      });
    }

    function initSession() {
      const sessionData = localStorage.getItem('o_asis_session');
      const authSection = document.getElementById('auth-section');
      const mainSection = document.getElementById('main-section');
      const userDisplay = document.getElementById('user-display');
      const adminBadge = document.getElementById('admin-badge');
      const userDisplayArea = document.getElementById('user-display-area');

      if (sessionData) {
        try {
          const user = JSON.parse(sessionData);
          userDisplay.textContent = escapeHtml(user.name);
          adminBadge.textContent = user.isAdmin ? '[ADMIN]' : '[USER]';
          userDisplayArea.classList.remove('hidden');
          
          // ログイン名を投稿名欄とDMお名前欄に自動反映
          const postAuthorInput = document.getElementById('new-post-author');
          if (postAuthorInput) postAuthorInput.value = user.name;
          
          const dmNameInput = document.getElementById('dm-name');
          if (dmNameInput) dmNameInput.value = user.name;

          authSection.style.display = 'none';
          mainSection.classList.remove('hidden');
          
          loadStatus();
          loadTimeline();
          loadGallery();
        } catch(e) {
          logout();
        }
      } else {
        authSection.style.display = 'block';
        mainSection.classList.add('hidden');
        userDisplayArea.classList.add('hidden');
      }
    }

    function logout() {
      localStorage.removeItem('o_asis_session');
      document.getElementById('auth-name').value = '';
      document.getElementById('auth-pass').value = '';
      
      // 入力欄に反映されていたログイン名もクリア
      const postAuthorInput = document.getElementById('new-post-author');
      if (postAuthorInput) postAuthorInput.value = '';
      const dmNameInput = document.getElementById('dm-name');
      if (dmNameInput) dmNameInput.value = '';

      initSession();
    }

    // 効果音処理
    function playSound(type) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'tab') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
          gain.gain.setValueAtTime(0.025, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);
          osc.start(now); osc.stop(now + 0.08);
        } else if (type === 'modal') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(1320, now + 0.15);
          gain.gain.setValueAtTime(0.03, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);
          osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'action') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(659.25, now);
          osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.1);
          gain.gain.setValueAtTime(0.03, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
          osc.start(now); osc.stop(now + 0.1);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.exponentialRampToValueAtTime(400, now + 0.04);
          gain.gain.setValueAtTime(0.02, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.04);
          osc.start(now); osc.stop(now + 0.04);
        }
      } catch (e) {}
    }

    // タブ切り替え
    function switchTab(tabName, event) {
      playSound('tab');
      document.querySelectorAll('#main-section .tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('#main-section .card').forEach(c => c.classList.remove('active'));
      event.currentTarget.classList.add('active');
      document.getElementById('tab-' + tabName).classList.add('active');
    }

    function copyDiscord() {
      navigator.clipboard.writeText('vamos_cantar').then(() => alert('Discord ID をコピーしました。'));
    }

    function loadStatus() {
      const savedStatus = localStorage.getItem('o_asis_status') || '(通常営業中)';
      document.getElementById('current-status-text').innerText = savedStatus;
    }

    function updateStatusText() {
      const val = document.getElementById('status-input').value.trim();
      if (!val) return;
      localStorage.setItem('o_asis_status', val);
      document.getElementById('status-input').value = '';
      loadStatus();
      alert('ステータスを更新しました。');
    }

    // タイムライン処理
    function loadTimeline() {
      fetch('posts.json')
        .then(res => res.json())
        .then(jsonPosts => {
          const localPosts = JSON.parse(localStorage.getItem('o_asis_local_posts') || '[]');
          const allPosts = localPosts.length > 0 ? localPosts : jsonPosts;
          renderTimeline(allPosts);
        })
        .catch(() => {
          const localPosts = JSON.parse(localStorage.getItem('o_asis_local_posts') || '[]');
          renderTimeline(localPosts);
        });
    }

    function addNewPost() {
      const authorInput = document.getElementById('new-post-author');
      const textInput = document.getElementById('new-post-text');
      const imageInput = document.getElementById('new-post-image');

      const text = textInput.value.trim();
      if (!text) {
        alert('本文を入力してください。');
        return;
      }

      const now = new Date();
      const dateStr = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}.${String(now.getHours()).padStart(2,'0')}.${String(now.getMinutes()).padStart(2,'0')}`;

      const newPost = {
        id: 'post-' + Date.now(),
        author: authorInput.value.trim() || 'O-ji',
        date: dateStr,
        text: text,
        image: imageInput.value.trim(),
        comments: []
      };

      fetch('posts.json')
        .then(res => res.json())
        .then(jsonPosts => {
          let localPosts = JSON.parse(localStorage.getItem('o_asis_local_posts') || '[]');
          if (localPosts.length === 0) localPosts = jsonPosts;
          localPosts.unshift(newPost);
          localStorage.setItem('o_asis_local_posts', JSON.stringify(localPosts));
          textInput.value = ''; imageInput.value = '';
          renderTimeline(localPosts);
        })
        .catch(() => {
          let localPosts = JSON.parse(localStorage.getItem('o_asis_local_posts') || '[]');
          localPosts.unshift(newPost);
          localStorage.setItem('o_asis_local_posts', JSON.stringify(localPosts));
          textInput.value = ''; imageInput.value = '';
          renderTimeline(localPosts);
        });
    }

    function renderTimeline(posts) {
      const container = document.getElementById('timeline-container');
      if (!posts || posts.length === 0) {
        container.innerHTML = '<div class="loading">NO TIMELINE DATA</div>';
        return;
      }
      container.innerHTML = '';
      posts.forEach((post, index) => {
        const card = document.createElement('div');
        card.className = 'post-card';
        
        let imageHtml = (post.image && post.image.trim() !== "") 
          ? `<img src="${post.image}" class="gallery-image" style="border-radius:12px; margin-top:12px; cursor:pointer;" onclick="playSound('modal'); openModalWithImage('${post.image}', '${escapeHtml(post.date)}', '${escapeHtml(post.text)}')">` 
          : '';
        
        let authorHtml = post.author ? `<span style="color:#c084fc; margin-right:8px;">${escapeHtml(post.author)}</span>` : '';

        let commentsHtml = '';
        if (post.comments && post.comments.length > 0) {
          post.comments.forEach(comm => {
            commentsHtml += `
              <div class="comment-item">
                <div class="comment-header">
                  <span><b style="color:#c084fc;">${escapeHtml(comm.author)}</b></span>
                  <span>${escapeHtml(comm.date)}</span>
                </div>
                <div style="word-break:break-all; font-weight:300; line-height:1.4;">${escapeHtml(comm.text)}</div>
              </div>
            `;
          });
        }

        card.innerHTML = `
          <div class="post-header"><span>${authorHtml}${escapeHtml(post.date || '')}</span></div>
          <div style="font-size:0.85rem; font-weight:300; line-height:1.6; word-break:break-all;">${escapeHtml(post.text || '')}</div>
          ${imageHtml}
          
          <div class="comments-section">
            <div style="font-size:0.6rem; color:var(--text-muted); margin-bottom:8px; letter-spacing:1px;">REPLIES</div>
            <div id="comments-list-${index}">${commentsHtml}</div>
            
            <div style="margin-top: 10px; display: flex; flex-direction: column; gap: 6px;">
              <input type="text" id="comment-author-${index}" placeholder="お名前（任意）" style="margin-bottom:0; font-size:0.7rem; padding:8px 12px;">
              <div style="display: flex; gap: 6px;">
                <input type="text" id="comment-text-${index}" placeholder="返信を入力..." style="margin-bottom:0; font-size:0.7rem; padding:8px 12px;" onkeypress="if(event.key === 'Enter') addComment(${index})">
                <button onclick="playSound('action'); addComment(${index})" style="width: auto; padding: 8px 14px; font-size:0.6rem;">REPLY</button>
              </div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function addComment(index) {
      const authorInput = document.getElementById(`comment-author-${index}`);
      const textInput = document.getElementById(`comment-text-${index}`);
      
      const author = authorInput.value.trim() || 'ゲスト';
      const text = textInput.value.trim();
      if (!text) return;

      const now = new Date();
      const dateStr = `${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

      fetch('posts.json')
        .then(res => res.json())
        .then(jsonPosts => {
          let localPosts = JSON.parse(localStorage.getItem('o_asis_local_posts') || '[]');
          if (localPosts.length === 0) localPosts = jsonPosts;
          if (!localPosts[index].comments) localPosts[index].comments = [];
          localPosts[index].comments.push({ author: author, date: dateStr, text: text });
          localStorage.setItem('o_asis_local_posts', JSON.stringify(localPosts));
          renderTimeline(localPosts);
        })
        .catch(() => {
          let localPosts = JSON.parse(localStorage.getItem('o_asis_local_posts') || '[]');
          if (localPosts[index]) {
            if (!localPosts[index].comments) localPosts[index].comments = [];
            localPosts[index].comments.push({ author: author, date: dateStr, text: text });
            localStorage.setItem('o_asis_local_posts', JSON.stringify(localPosts));
            renderTimeline(localPosts);
          }
        });
    }

    // ギャラリー & モーダル
    function loadGallery() {
      fetch('gallery.json').then(res => res.json()).then(items => {
        const container = document.getElementById('gallery-container');
        if (!items) return;
        container.innerHTML = '';
        const grid = document.createElement('div');
        grid.className = 'gallery-grid';
        items.forEach(item => {
          const div = document.createElement('div');
          div.className = 'gallery-item';
          div.innerHTML = `<img src="${item.image}" class="gallery-image"><div class="gallery-info">${item.title || ''}</div>`;
          div.onclick = () => { openModalWithImage(item.image, item.title || '', item.description || ''); };
          grid.appendChild(div);
        });
        container.appendChild(grid);
      }).catch(() => {});
    }

    function openModalWithImage(imgSrc, dateStr, textStr) {
      playSound('modal');
      document.getElementById('modal-img').src = imgSrc;
      document.getElementById('modal-title').innerText = dateStr;
      document.getElementById('modal-desc').innerText = textStr;
      document.getElementById('image-modal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('image-modal').classList.remove('show');
    }

    // DM暗号通信
    function sendAndOpenDm() {
      const name = document.getElementById('dm-name').value.trim();
      const birthday = document.getElementById('dm-birthday').value.trim();
      const message = document.getElementById('dm-message').value.trim();

      if (!name || !birthday || !message) {
        alert('お名前、暗証番号、メッセージをすべて入力してください。');
        return;
      }

      currentName = name; currentBirthday = birthday;

      fetch(DM_GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ birthday: birthday, name: name, message: message, sender: 'guest' })
      })
      .then(res => res.json())
      .then(() => {
        document.getElementById('dm-message').value = '';
        openDmChatUI();
      })
      .catch(() => alert('送信に失敗しました。'));
    }

    function openDmChatUI() {
      document.getElementById('dm-login-box').style.display = 'none';
      document.getElementById('dm-chat-box').style.display = 'block';
      document.getElementById('current-dm-info').innerText = `KEY: [ ${currentBirthday} ] (${currentName})`;
      fetchDmMessages();
    }

    function closeDmChat() {
      document.getElementById('dm-chat-box').style.display = 'none';
      document.getElementById('dm-login-box').style.display = 'block';
    }

    function fetchDmMessages() {
      if (!currentBirthday) return;
      fetch(`${DM_GAS_URL}?birthday=${encodeURIComponent(currentBirthday)}`)
        .then(res => res.json())
        .then(resData => {
          const data = resData.data || [];
          const container = document.getElementById('dm-messages');
          container.innerHTML = '';
          if (data.length === 0) {
            container.innerHTML = '<div class="loading">NO MESSAGES</div>';
            return;
          }
          data.forEach(item => {
            const isAdmin = item.sender === 'admin';
            const bubble = document.createElement('div');
            bubble.className = `box-bubble ${isAdmin ? 'admin' : 'guest'}`;
            bubble.innerHTML = `
              <div style="display:flex; justify-content:space-between; font-size:0.6rem; color:var(--text-muted); margin-bottom:6px; letter-spacing:1px;">
                <span><b>${isAdmin ? 'O-ji (管理人)' : escapeHtml(item.name)}</b></span>
                <span>${escapeHtml(item.timestamp)}</span>
              </div>
              <div style="color:var(--text-main); word-break:break-all; font-weight:300; line-height:1.5;">${escapeHtml(item.message)}</div>
            `;
            container.appendChild(bubble);
          });
          container.scrollTop = container.scrollHeight;
        }).catch(() => {});
    }

    function sendDmReply(e) {
      e.preventDefault();
      const input = document.getElementById('dm-reply-msg');
      const message = input.value.trim();
      if (!message || !currentBirthday) return;

      fetch(DM_GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ birthday: currentBirthday, name: currentName, message: message, sender: 'guest' })
      })
      .then(res => res.json())
      .then(() => {
        input.value = '';
        fetchDmMessages();
      })
      .catch(() => alert('送信に失敗しました。'));
    }

    function loginAsAdmin() {
      const passkey = document.getElementById('admin-passkey').value.trim();
      if (passkey !== "20040808") {
        alert('パスキーが正しくありません。');
        return;
      }
      document.getElementById('dm-guest-section').style.display = 'none';
      document.getElementById('admin-dashboard').style.display = 'block';
      fetchAdminData(passkey);
    }

    function logoutAdmin() {
      document.getElementById('admin-dashboard').style.display = 'none';
      document.getElementById('dm-guest-section').style.display = 'block';
      document.getElementById('admin-passkey').value = '';
    }

    function fetchAdminData(passkey) {
      fetch(`${DM_GAS_URL}?passkey=${encodeURIComponent(passkey)}`)
        .then(res => res.json())
        .then(resData => {
          const listContainer = document.getElementById('admin-messages-list');
          listContainer.innerHTML = '';
          const data = resData.data || [];
          if (data.length === 0) {
            listContainer.innerHTML = '<div class="loading">NO MESSAGES FOUND</div>';
            return;
          }

          const groups = {};
          data.forEach(item => {
            if (!groups[item.birthday]) groups[item.birthday] = [];
            groups[item.birthday].push(item);
          });

          for (let bday in groups) {
            const thread = groups[bday];
            const guestName = thread.find(t => t.sender !== 'admin')?.name || 'ゲスト';
            
            const card = document.createElement('div');
            card.className = 'post-card';
            
            let messagesHtml = '';
            thread.forEach(t => {
              const isAdmin = t.sender === 'admin';
              messagesHtml += `
                <div style="background: ${isAdmin ? 'rgba(192,132,252,0.08)' : 'rgba(4,5,8,0.5)'}; padding:10px 12px; border-radius:10px; margin-bottom:8px; font-size:0.8rem;">
                  <div style="font-size:0.6rem; color:var(--text-muted); display:flex; justify-content:space-between; letter-spacing:1px;">
                    <span><b>${isAdmin ? 'あなた（管理人）' : escapeHtml(t.name)}</b></span>
                    <span>${escapeHtml(t.timestamp)}</span>
                  </div>
                  <div style="margin-top:6px; word-break:break-all; font-weight:300; line-height:1.5;">${escapeHtml(t.message)}</div>
                </div>
              `;
            });

            card.innerHTML = `
              <div class="post-header"><span>KEY: ${bday} (${guestName})</span><span>${thread.length}件</span></div>
              <div style="margin-bottom:12px;">${messagesHtml}</div>
              <div style="display:flex; gap:8px;">
                <input type="text" id="admin-reply-${bday}" placeholder="管理人として返信..." style="margin-bottom:0; font-size:0.75rem; padding:10px;">
                <button onclick="playSound('action'); sendAdminReply('${bday}', '${guestName}')" style="width:auto; padding:10px 16px; font-size:0.65rem;">返信</button>
              </div>
            `;
            listContainer.appendChild(card);
          }
        }).catch(() => alert('データの取得に失敗しました。'));
    }

    function sendAdminReply(birthday, name) {
      const input = document.getElementById(`admin-reply-${birthday}`);
      const message = input.value.trim();
      if (!message) return;

      fetch(DM_GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ birthday: birthday, name: name, message: message, sender: 'admin' })
      })
      .then(res => res.json())
      .then(() => {
        input.value = '';
        loginAsAdmin();
      })
      .catch(() => alert('返信に失敗しました。'));
    }

    document.addEventListener('DOMContentLoaded', initSession);
  </script>
</body>
</html>
