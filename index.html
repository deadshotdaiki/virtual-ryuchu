<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O-asis</title>
  <style>
    :root {
      --bg-color: #080a0f;
      --card-bg: rgba(18, 22, 31, 0.75);
      --accent-color: #c084fc;
      --accent-hover: #a855f7;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: rgba(192, 132, 252, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; padding: 20px 12px; }
    .container { width: 100%; max-width: 680px; }
    header { text-align: center; margin-bottom: 24px; }
    h1 { font-size: 2rem; letter-spacing: 2px; color: var(--accent-color); margin-bottom: 6px; }
    .user-info { font-size: 0.8rem; color: var(--text-muted); display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 8px; }
    .btn-logout { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; cursor: pointer; }
    .auth-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 24px; backdrop-filter: blur(10px); }
    input, textarea { width: 100%; background: rgba(4, 5, 8, 0.6); border: 1px solid var(--border-color); color: var(--text-main); padding: 12px; border-radius: 8px; margin-bottom: 12px; outline: none; font-size: 0.9rem; }
    input:focus, textarea:focus { border-color: var(--accent-color); }
    button { width: 100%; background: var(--accent-color); color: #000; font-weight: bold; border: none; padding: 12px; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
    button:hover { background: var(--accent-hover); }
    .hidden { display: none !important; }
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn { flex: 1; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-muted); padding: 10px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }
    .tab-btn.active { background: var(--accent-color); color: #000; font-weight: bold; border-color: var(--accent-color); }
    .card { display: none; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; backdrop-filter: blur(10px); }
    .card.active { display: block; }
    
    .post-card { background: rgba(4, 5, 8, 0.4); border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
    .post-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px; }
    .btn-delete { background: transparent; color: #ef4444; border: none; font-size: 0.7rem; cursor: pointer; width: auto; padding: 0; }
    .comments-section { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--border-color); }
    .comment-item { background: rgba(255, 255, 255, 0.03); padding: 8px; border-radius: 6px; margin-bottom: 6px; font-size: 0.8rem; }
    .comment-header { display: flex; justify-content: space-between; font-size: 0.65rem; color: var(--text-muted); margin-bottom: 4px; }

    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .gallery-item { background: rgba(4, 5, 8, 0.5); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; cursor: pointer; }
    .gallery-image { width: 100%; height: 120px; object-fit: cover; display: block; }
    .gallery-info { padding: 6px; font-size: 0.7rem; text-align: center; color: var(--text-muted); }

    .chat-container { display: flex; flex-direction: column; height: 420px; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
    .chat-bubble { max-width: 75%; padding: 10px 14px; border-radius: 14px; font-size: 0.85rem; line-height: 1.4; word-break: break-all; }
    .chat-bubble.mine { align-self: flex-end; background: var(--accent-color); color: #000; border-bottom-right-radius: 2px; }
    .chat-bubble.other { align-self: flex-start; background: rgba(255, 255, 255, 0.1); border: 1px solid var(--border-color); border-bottom-left-radius: 2px; }
    .chat-time { font-size: 0.6rem; opacity: 0.7; margin-top: 4px; text-align: right; }
    .chat-input-area { display: flex; gap: 6px; padding-top: 10px; border-top: 1px solid var(--border-color); }

    .fab-btn { position: fixed; bottom: 30px; right: 30px; width: 56px; height: 56px; background: var(--accent-color); color: #000; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 28px; font-weight: bold; border: none; cursor: pointer; box-shadow: 0 4px 12px rgba(192, 132, 252, 0.4); z-index: 999; }
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
    .modal.show { display: flex; }
    .modal-content { background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 12px; max-width: 500px; width: 100%; padding: 16px; position: relative; }
    .modal-close { position: absolute; top: 10px; right: 14px; background: none; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; width: auto; }
    .loading { text-align: center; padding: 20px; color: var(--text-muted); font-size: 0.8rem; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>O-asis</h1>
      <div id="user-display-area" class="user-info hidden">
        <span id="user-display"></span>
        <span id="admin-badge" style="color:var(--accent-color);"></span>
        <button class="btn-logout" onclick="logout()">LOGOUT</button>
      </div>
    </header>

    <div id="auth-section" class="auth-card">
      <h2 style="font-size:1.1rem; margin-bottom:14px; text-align:center;">LOGIN</h2>
      <input type="text" id="auth-name" placeholder="ユーザー名">
      <input type="password" id="auth-pass" placeholder="パスワード">
      <button onclick="handleLogin()">ログイン</button>
    </div>

    <div id="main-section" class="hidden">
      <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('timeline', event)">TIMELINE</button>
        <button class="tab-btn" onclick="switchTab('gallery', event)">GALLERY</button>
        <button class="tab-btn" onclick="switchTab('talk', event)">TALK</button>
      </div>

      <div id="tab-timeline" class="card active">
        <div id="timeline-container"></div>
      </div>

      <div id="tab-gallery" class="card">
        <div id="gallery-container"></div>
      </div>

      <div id="tab-talk" class="card">
        <div id="admin-talk-selector" style="display:none; margin-bottom:10px;">
          <select id="user-chat-select" onchange="changeAdminChatTarget()" style="width:100%; padding:8px; background:rgba(4,5,8,0.8); color:var(--text-main); border:1px solid var(--border-color); border-radius:8px; outline:none; font-size:0.85rem;">
            <option value="">トーク相手を選択...</option>
          </select>
        </div>

        <div class="chat-container">
          <div id="chat-messages" class="chat-messages">
            <div class="loading">メッセージを読み込んでいます...</div>
          </div>
          <form class="chat-input-area" onsubmit="sendChatMessage(event)">
            <input type="text" id="chat-reply-input" placeholder="メッセージを入力..." style="margin-bottom:0;" autocomplete="off">
            <button type="submit" style="width:auto; padding:0 18px;">送信</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <button id="fab-post-btn" class="fab-btn hidden" onclick="openPostModal()">＋</button>

  <div id="post-modal" class="modal" onclick="closePostModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closePostModal()">✕</button>
      <h3 style="font-size: 1rem; color: var(--accent-color); margin-bottom: 12px;">新規ツイート</h3>
      <textarea id="new-post-text" placeholder="いまどうしてる？" rows="4"></textarea>
      <input type="text" id="new-post-image" placeholder="画像URL (任意)">
      <button onclick="addNewPost()">投稿する</button>
    </div>
  </div>

  <div id="image-modal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <img id="modal-img" src="" style="width:100%; border-radius:8px; margin-bottom:10px;">
      <div id="modal-title" style="font-weight:bold; font-size:0.9rem; color:var(--accent-color);"></div>
      <div id="modal-desc" style="font-size:0.8rem; color:var(--text-muted); margin-top:4px;"></div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxp37Qn2szv0J5S0Sc0n7YNVvBC4ShngrmelMSb9f_xWHHu3N4Pec2eSbicCdtQ8pkLrg/exec";

    let currentUser = null;
    let activeAdminChatUser = "";

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    window.addEventListener('DOMContentLoaded', () => {
      initSession();
    });

    function handleLogin() {
      const name = document.getElementById('auth-name').value.trim();
      const pass = document.getElementById('auth-pass').value.trim();
      if (!name || !pass) { alert('ユーザー名とパスワードを入力してください。'); return; }

      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'login', name: name, pass: pass })
      })
      .then(res => res.json())
      .then(resData => {
        if (resData.status === 'success') {
          currentUser = { name: name, isAdmin: resData.isAdmin };
          localStorage.setItem('o_asis_session', JSON.stringify(currentUser));
          initSession();
        } else {
          alert('認証に失敗しました。');
        }
      })
      .catch(() => alert('サーバーとの通信に失敗しました。'));
    }

    function initSession() {
      const sessionData = localStorage.getItem('o_asis_session');
      if (sessionData) {
        try {
          currentUser = JSON.parse(sessionData);
          document.getElementById('user-display').textContent = escapeHtml(currentUser.name);
          document.getElementById('admin-badge').textContent = currentUser.isAdmin ? '[ADMIN]' : '[USER]';
          document.getElementById('user-display-area').classList.remove('hidden');
          document.getElementById('fab-post-btn').classList.remove('hidden');

          document.getElementById('auth-section').style.display = 'none';
          document.getElementById('main-section').classList.remove('hidden');

          loadTimeline();
          loadGallery();
          initTalkTab();
        } catch(e) {
          logout();
        }
      } else {
        document.getElementById('auth-section').style.display = 'block';
        document.getElementById('main-section').classList.add('hidden');
        document.getElementById('user-display-area').classList.add('hidden');
        document.getElementById('fab-post-btn').classList.add('hidden');
      }
    }

    function logout() {
      localStorage.removeItem('o_asis_session');
      currentUser = null;
      document.getElementById('auth-name').value = '';
      document.getElementById('auth-pass').value = '';
      initSession();
    }

    function switchTab(tabName, event) {
      document.querySelectorAll('#main-section .tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('#main-section .card').forEach(c => c.classList.remove('active'));
      event.currentTarget.classList.add('active');
      document.getElementById('tab-' + tabName).classList.add('active');
      if (tabName === 'talk') fetchTalkMessages();
    }

    function openPostModal() { document.getElementById('post-modal').classList.add('show'); }
    function closePostModal() { document.getElementById('post-modal').classList.remove('show'); }
    function openModalWithImage(imgSrc, dateStr, textStr) {
      document.getElementById('modal-img').src = imgSrc;
      document.getElementById('modal-title').innerText = dateStr;
      document.getElementById('modal-desc').innerText = textStr;
      document.getElementById('image-modal').classList.add('show');
    }
    function closeModal() { document.getElementById('image-modal').classList.remove('show'); }

    function loadTimeline() {
      const localPosts = JSON.parse(localStorage.getItem('o_asis_local_posts') || '[]');
      renderTimeline(localPosts);
    }
    
    function addNewPost() {
      const text = document.getElementById('new-post-text').value.trim();
      const image = document.getElementById('new-post-image').value.trim();
      if (!text) { alert('本文を入力してください。'); return; }

      const now = new Date();
      const dateStr = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      const newPost = { author: currentUser.name, date: dateStr, text: text, image: image, comments: [] };

      let localPosts = JSON.parse(localStorage.getItem('o_asis_local_posts') || '[]');
      localPosts.unshift(newPost);
      localStorage.setItem('o_asis_local_posts', JSON.stringify(localPosts));
      document.getElementById('new-post-text').value = ''; document.getElementById('new-post-image').value = '';
      closePostModal();
      renderTimeline(localPosts);
    }

    function deletePost(idx) {
      if (!confirm('削除しますか？')) return;
      let posts = JSON.parse(localStorage.getItem('o_asis_local_posts') || '[]');
      posts.splice(idx, 1);
      localStorage.setItem('o_asis_local_posts', JSON.stringify(posts));
      renderTimeline(posts);
    }

    function addComment(postIdx) {
      const replyText = prompt('リプライを入力してください：');
      if (!replyText) return;
      const now = new Date();
      const dateStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      
      let posts = JSON.parse(localStorage.getItem('o_asis_local_posts') || '[]');
      if (!posts[postIdx].comments) posts[postIdx].comments = [];
      posts[postIdx].comments.push({ author: currentUser.name, text: replyText, date: dateStr });
      localStorage.setItem('o_asis_local_posts', JSON.stringify(posts));
      renderTimeline(posts);
    }

    function renderTimeline(posts) {
      const container = document.getElementById('timeline-container');
      if (posts.length === 0) { container.innerHTML = '<div class="loading">投稿がありません</div>'; return; }
      container.innerHTML = '';
      posts.forEach((post, i) => {
        const card = document.createElement('div');
        card.className = 'post-card';
        const imgHtml = post.image ? `<img src="${post.image}" class="gallery-image" style="border-radius:12px; margin-top:12px;" onclick="openModalWithImage('${post.image}','','')">` : '';
        const delBtn = (currentUser && (currentUser.isAdmin || currentUser.name === post.author)) ? `<button class="btn-delete" onclick="deletePost(${i})">削除</button>` : '';
        
        let commentsHtml = '';
        if (post.comments && post.comments.length > 0) {
          commentsHtml = '<div class="comments-section">';
          post.comments.forEach(c => {
            commentsHtml += `
              <div class="comment-item">
                <div class="comment-header"><span><b>${escapeHtml(c.author)}</b></span><span>${escapeHtml(c.date)}</span></div>
                <div>${escapeHtml(c.text)}</div>
              </div>`;
          });
          commentsHtml += '</div>';
        }

        card.innerHTML = `
          <div class="post-header"><span><b style="color:var(--accent-color);">${escapeHtml(post.author)}</b> ${escapeHtml(post.date)}</span>${delBtn}</div>
          <div style="font-size:0.85rem; line-height:1.6; word-break:break-all;">${escapeHtml(post.text)}</div>
          ${imgHtml}
          ${commentsHtml}
          <div style="margin-top:10px; text-align:right;">
            <button onclick="addComment(${i})" style="width:auto; padding:4px 10px; font-size:0.75rem; background:transparent; border:1px solid var(--border-color); color:var(--text-muted);">リプライ</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function loadGallery() {
      const container = document.getElementById('gallery-container');
      const galleryItems = [
        { image: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400", title: "Abstract Art 01", desc: "O-asis Concept Visual" },
        { image: "https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?w=400", title: "Cyber Neon", desc: "Atmosphere Study" }
      ];

      let gridHtml = '<div class="gallery-grid">';
      galleryItems.forEach(item => {
        gridHtml += `
          <div class="gallery-item" onclick="openModalWithImage('${item.image}', '${escapeHtml(item.title)}', '${escapeHtml(item.desc)}')">
            <img src="${item.image}" class="gallery-image">
            <div class="gallery-info">${escapeHtml(item.title)}</div>
          </div>`;
      });
      gridHtml += '</div>';
      container.innerHTML = gridHtml;
    }

    function initTalkTab() {
      const adminSelector = document.getElementById('admin-talk-selector');
      if (currentUser && currentUser.isAdmin) {
        adminSelector.style.display = 'block';
        fetchAdminUserList();
      } else {
        adminSelector.style.display = 'none';
        activeAdminChatUser = currentUser.name; 
        fetchTalkMessages();
      }
    }

    function fetchAdminUserList() {
      fetch(`${GAS_URL}?action=getUserList`)
        .then(res => res.json())
        .then(resData => {
          const select = document.getElementById('user-chat-select');
          const users = resData.users || [];
          select.innerHTML = '<option value="">トーク相手のゲストを選択...</option>';
          users.forEach(u => {
            if (u === 'admin') return;
            const opt = document.createElement('option');
            opt.value = u; opt.textContent = u;
            if (u === activeAdminChatUser) opt.selected = true;
            select.appendChild(opt);
          });
        }).catch(e => console.error(e));
    }

    function changeAdminChatTarget() {
      activeAdminChatUser = document.getElementById('user-chat-select').value;
      fetchTalkMessages();
    }

    function fetchTalkMessages() {
      if (!currentUser) return;
      const container = document.getElementById('chat-messages');
      const targetUser = currentUser.isAdmin ? activeAdminChatUser : currentUser.name;

      if (currentUser.isAdmin && !targetUser) {
        container.innerHTML = '<div class="loading">上のリストから話したいゲストを選択してくれ。</div>';
        return;
      }

      container.innerHTML = '<div class="loading">読み込み中...</div>';
      
      fetch(`${GAS_URL}?user=${encodeURIComponent(targetUser)}`)
        .then(res => res.json())
        .then(resData => {
          const data = resData.data || [];
          container.innerHTML = '';
          if (data.length === 0) {
            container.innerHTML = '<div class="loading">まだメッセージがないようだ。</div>';
            return;
          }

          data.forEach(msg => {
            const isMine = currentUser.isAdmin ? (msg.sender === 'admin') : (msg.sender !== 'admin');
            const bubble = document.createElement('div');
            bubble.className = `chat-bubble ${isMine ? 'mine' : 'other'}`;
            bubble.innerHTML = `
              <div>${escapeHtml(msg.message)}</div>
              <div class="chat-time">${escapeHtml(msg.timestamp || '')}</div>
            `;
            container.appendChild(bubble);
          });
          container.scrollTop = container.scrollHeight;
        })
        .catch(() => { container.innerHTML = '<div class="loading">通信エラーだ。後でもう一度試してくれ。</div>'; });
    }

    function sendChatMessage(e) {
      e.preventDefault();
      const input = document.getElementById('chat-reply-input');
      const message = input.value.trim();
      if (!message || !currentUser) return;

      const targetUser = currentUser.isAdmin ? activeAdminChatUser : currentUser.name;
      if (currentUser.isAdmin && !targetUser) { alert('先にトーク相手を選択しろ！'); return; }

      const payload = {
        user: targetUser,
        name: currentUser.name,
        message: message,
        sender: currentUser.isAdmin ? 'admin' : 'user'
      };

      input.value = '';
      const container = document.getElementById('chat-messages');
      const tempBubble = document.createElement('div');
      tempBubble.className = 'chat-bubble mine';
      tempBubble.style.opacity = '0.5';
      tempBubble.innerHTML = `<div>${escapeHtml(message)}</div><div class="chat-time">送信中...</div>`;
      container.appendChild(tempBubble);
      container.scrollTop = container.scrollHeight;

      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(() => { setTimeout(fetchTalkMessages, 800); })
      .catch(() => { alert('送信に失敗した。'); tempBubble.remove(); });
    }
  </script>
</body>
</html>
