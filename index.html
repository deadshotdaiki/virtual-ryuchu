<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O-asis</title>
  <style>
    :root {
      --bg-color: #080a0f;
      --card-bg: rgba(18, 22, 31, 0.75);
      --accent-color: #c084fc;
      --accent-hover: #a855f7;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: rgba(192, 132, 252, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px 12px;
      position: relative;
    }

    .container {
      width: 100%;
      max-width: 680px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 2rem;
      letter-spacing: 2px;
      color: var(--accent-color);
      margin-bottom: 6px;
    }

    .user-info {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    .btn-logout {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      cursor: pointer;
    }

    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(10px);
    }

    input, textarea {
      width: 100%;
      background: rgba(4, 5, 8, 0.6);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      outline: none;
      font-size: 0.9rem;
    }

    input:focus, textarea:focus {
      border-color: var(--accent-color);
    }

    button {
      width: 100%;
      background: var(--accent-color);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--accent-hover);
    }

    .hidden {
      display: none !important;
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab-btn {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .tab-btn.active {
      background: var(--accent-color);
      color: #000;
      font-weight: bold;
      border-color: var(--accent-color);
    }

    .card {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: blur(10px);
    }

    .card.active {
      display: block;
    }

    /* タイムライン */
    .post-card {
      background: rgba(4, 5, 8, 0.4);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .btn-delete {
      background: transparent;
      color: #ef4444;
      border: none;
      font-size: 0.7rem;
      cursor: pointer;
      width: auto;
      padding: 0;
    }

    .comments-section {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed var(--border-color);
    }

    .comment-item {
      background: rgba(255, 255, 255, 0.03);
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 0.8rem;
    }

    .comment-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    /* ギャラリー */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }

    .gallery-item {
      background: rgba(4, 5, 8, 0.5);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
    }

    .gallery-image {
      width: 100%;
      height: 120px;
      object-fit: cover;
      display: block;
    }

    .gallery-info {
      padding: 6px;
      font-size: 0.7rem;
      text-align: center;
      color: var(--text-muted);
    }

    /* LINE風 トークUI */
    .chat-container {
      display: flex;
      flex-direction: column;
      height: 420px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.85rem;
      line-height: 1.4;
      word-break: break-all;
    }

    .chat-bubble.mine {
      align-self: flex-end;
      background: var(--accent-color);
      color: #000;
      border-bottom-right-radius: 2px;
    }

    .chat-bubble.other {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 2px;
    }

    .chat-time {
      font-size: 0.6rem;
      opacity: 0.7;
      margin-top: 4px;
      text-align: right;
    }

    .chat-input-area {
      display: flex;
      gap: 6px;
      padding-top: 10px;
      border-top: 1px solid var(--border-color);
    }

    /* フローティングプラスボタン (ツイート作成用) */
    .fab-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 56px;
      height: 56px;
      background: var(--accent-color);
      color: #000;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(192, 132, 252, 0.4);
      z-index: 999;
      transition: transform 0.2s, background 0.2s;
    }

    .fab-btn:hover {
      transform: scale(1.08);
      background: var(--accent-hover);
    }

    /* モーダル */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal.show { display: flex; }

    .modal-content {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      max-width: 500px;
      width: 100%;
      padding: 16px;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 10px; right: 14px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      width: auto;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: var(--text-muted);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>O-asis</h1>
      <div id="user-display-area" class="user-info hidden">
        <span id="user-display"></span>
        <span id="admin-badge" style="color:var(--accent-color);"></span>
        <button class="btn-logout" onclick="logout()">LOGOUT</button>
      </div>
    </header>

    <!-- 認証画面 -->
    <div id="auth-section" class="auth-card">
      <h2 style="font-size:1.1rem; margin-bottom:14px; text-align:center;">LOGIN</h2>
      <input type="text" id="auth-name" placeholder="ユーザー名">
      <input type="password" id="auth-pass" placeholder="パスワード">
      <button onclick="handleLogin()">ログイン</button>
    </div>

    <!-- メインコンテンツ -->
    <div id="main-section" class="hidden">
      <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('timeline', event)">TIMELINE</button>
        <button class="tab-btn" onclick="switchTab('gallery', event)">GALLERY</button>
        <button class="tab-btn" onclick="switchTab('talk', event)">TALK</button>
      </div>

      <!-- TIMELINE (初期表示) -->
      <div id="tab-timeline" class="card active">
        <div id="timeline-container"></div>
      </div>

      <!-- GALLERY -->
      <div id="tab-gallery" class="card">
        <div id="gallery-container"></div>
      </div>

      <!-- TALK (LINE風 1対1トーク) -->
      <div id="tab-talk" class="card">
        <!-- 管理者用トーク選択メニュー -->
        <div id="admin-talk-selector" style="display:none; margin-bottom:10px;">
          <select id="user-chat-select" onchange="changeAdminChatTarget()" style="width:100%; padding:8px; background:rgba(4,5,8,0.8); color:var(--text-main); border:1px solid var(--border-color); border-radius:8px; outline:none; font-size:0.85rem;">
            <option value="">トーク相手を選択...</option>
          </select>
        </div>

        <div class="chat-container">
          <div id="chat-messages" class="chat-messages">
            <div class="loading">メッセージを読み込んでいます...</div>
          </div>
          <form class="chat-input-area" onsubmit="sendChatMessage(event)">
            <input type="text" id="chat-reply-input" placeholder="メッセージを入力..." style="margin-bottom:0;">
            <button type="submit" style="width:auto; padding:0 18px;">送信</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- ツイート投稿用フローティングボタン -->
  <button id="fab-post-btn" class="fab-btn hidden" onclick="openPostModal()">＋</button>

  <!-- ツイート投稿モーダル -->
  <div id="post-modal" class="modal" onclick="closePostModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closePostModal()">✕</button>
      <h3 style="font-size: 1rem; color: var(--accent-color); margin-bottom: 12px;">新規ツイート</h3>
      <textarea id="new-post-text" placeholder="いまどうしてる？" rows="4"></textarea>
      <input type="text" id="new-post-image" placeholder="画像URL (任意)">
      <button onclick="addNewPost()">投稿する</button>
    </div>
  </div>

  <!-- 画像閲覧モーダル -->
  <div id="image-modal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <img id="modal-img" src="" style="width:100%; border-radius:8px; margin-bottom:10px;">
      <div id="modal-title" style="font-weight:bold; font-size:0.9rem; color:var(--accent-color);"></div>
      <div id="modal-desc" style="font-size:0.8rem; color:var(--text-muted); margin-top:4px;"></div>
    </div>
  </div>

  <script>
    const AUTH_GAS_URL = "https://script.google.com/macros/s/AKfycbx-SJ2DJZuQw-vyr9-_hhV8JyGiA3-Ob7sj-9_fw-C1FHqu8HVa-ISuH7OusQURtNep4g/exec";
    const DM_GAS_URL = "https://script.google.com/macros/s/AKfycbyL7hDxmO3DJdg0XWCCtQBlZSMPT4SKNx3xlCDnOhJ60uSa2wExSzOkRSyrYMBrPvMAxw/exec";

    let currentUser = null;
    let audioCtx = null;
    let activeAdminChatUser = "";

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    // --- 認証 & ログイン状態維持 ---
    function handleLogin() {
      const nameInput = document.getElementById('auth-name');
      const passInput = document.getElementById('auth-pass');
      const name = nameInput.value.trim();
      const pass = passInput.value.trim();

      if (!name || !pass) {
        alert('ユーザー名とパスワードを入力してください。');
        return;
      }

      fetch(AUTH_GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'login', name: name, pass: pass })
      })
      .then(res => res.json())
      .then(resData => {
        if (resData.status === 'success') {
          currentUser = { name: name, isAdmin: resData.isAdmin };
          localStorage.setItem('o_asis_session', JSON.stringify(currentUser));
          initSession();
        } else {
          alert('認証に失敗しました。');
        }
      })
      .catch(err => {
        console.error('通信エラー:', err);
        alert('サーバーとの通信に失敗しました。');
      });
    }

    function initSession() {
      const sessionData = localStorage.getItem('o_asis_session');
      const authSection = document.getElementById('auth-section');
      const mainSection = document.getElementById('main-section');
      const userDisplay = document.getElementById('user-display');
      const adminBadge = document.getElementById('admin-badge');
      const userDisplayArea = document.getElementById('user-display-area');
      const fabBtn = document.getElementById('fab-post-btn');

      if (sessionData) {
        try {
          currentUser = JSON.parse(sessionData);
          userDisplay.textContent = escapeHtml(currentUser.name);
          adminBadge.textContent = currentUser.isAdmin ? '[ADMIN]' : '[USER]';
          userDisplayArea.classList.remove('hidden');
          fabBtn.classList.remove('hidden');

          authSection.style.display = 'none';
          mainSection.classList.remove('hidden');

          loadTimeline();
          loadGallery();
          initTalkTab();
        } catch(e) {
          logout();
        }
      } else {
        authSection.style.display = 'block';
        mainSection.classList.add('hidden');
        userDisplayArea.classList.add('hidden');
        fabBtn.classList.add('hidden');
      }
    }

    function logout() {
      localStorage.removeItem('o_asis_session');
      currentUser = null;
      document.getElementById('auth-name').value = '';
      document.getElementById('auth-pass').value = '';
      initSession();
    }

    // --- 効果音 ---
    function playSound(type) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'tab') {
          osc.type = 'sine'; osc.frequency.setValueAtTime(587.33, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
          gain.gain.setValueAtTime(0.025, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);
          osc.start(now); osc.stop(now + 0.08);
        } else if (type === 'action') {
          osc.type = 'sine'; osc.frequency.setValueAtTime(659.25, now);
          osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.1);
          gain.gain.setValueAtTime(0.03, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
          osc.start(now); osc.stop(now + 0.1);
        }
      } catch (e) {}
    }

    // --- タブ切り替え ---
    function switchTab(tabName, event) {
      playSound('tab');
      document.querySelectorAll('#main-section .tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('#main-section .card').forEach(c => c.classList.remove('active'));
      event.currentTarget.classList.add('active');
      document.getElementById('tab-' + tabName).classList.add('active');

      if (tabName === 'talk') {
        fetchTalkMessages();
      }
    }

    // --- ツイート投稿モーダル操作 ---
    function openPostModal() {
      playSound('modal');
      document.getElementById('post-modal').classList.add('show');
    }

    function closePostModal() {
      document.getElementById('post-modal').classList.remove('show');
    }

    // --- タイムライン機能 & 削除機能 ---
    function loadTimeline() {
      fetch('posts.json')
        .then(res => res.json())
        .then(jsonPosts => {
          const localPosts = JSON.parse(localStorage.getItem('o_asis_local_posts') || '[]');
          const allPosts = localPosts.length > 0 ? localPosts : jsonPosts;
          renderTimeline(allPosts);
        })
        .catch(() => {
          const localPosts = JSON.parse(localStorage.getItem('o_asis_local_posts') || '[]');
          renderTimeline(localPosts);
        });
    }

    function addNewPost() {
      const textInput = document.getElementById('new-post-text');
      const imageInput = document.getElementById('new-post-image');
      const text = textInput.value.trim();

      if (!text) {
        alert('本文を入力してください。');
        return;
      }

      const now = new Date();
      const dateStr = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}.${String(now.getHours()).padStart(2,'0')}.${String(now.getMinutes()).padStart(2,'0')}`;

      const newPost = {
        id: 'post-' + Date.now(),
        author: currentUser ? currentUser.name : 'ゲスト',
        date: dateStr,
        text: text,
        image: imageInput.value.trim(),
        comments: []
      };

      fetch('posts.json')
        .then(res => res.json())
        .then(jsonPosts => {
          let localPosts = JSON.parse(localStorage.getItem('o_asis_local_posts') || '[]');
          if (localPosts.length === 0) localPosts = jsonPosts;
          localPosts.unshift(newPost);
          localStorage.setItem('o_asis_local_posts', JSON.stringify(localPosts));
          textInput.value = ''; imageInput.value = '';
          closePostModal();
          renderTimeline(localPosts);
        })
        .catch(() => {
          let localPosts = JSON.parse(localStorage.getItem('o_asis_local_posts') || '[]');
          localPosts.unshift(newPost);
          localStorage.setItem('o_asis_local_posts', JSON.stringify(localPosts));
          textInput.value = ''; imageInput.value = '';
          closePostModal();
          renderTimeline(localPosts);
        });
    }

    function deletePost(postIndex) {
      if (!confirm('この投稿を削除しますか？')) return;
      let localPosts = JSON.parse(localStorage.getItem('o_asis_local_posts') || '[]');
      localPosts.splice(postIndex, 1);
      localStorage.setItem('o_asis_local_posts', JSON.stringify(localPosts));
      renderTimeline(localPosts);
    }

    function deleteComment(postIndex, commentIndex) {
      if (!confirm('この返信を削除しますか？')) return;
      let localPosts = JSON.parse(localStorage.getItem('o_asis_local_posts') || '[]');
      if (localPosts[postIndex] && localPosts[postIndex].comments) {
        localPosts[postIndex].comments.splice(commentIndex, 1);
        localStorage.setItem('o_asis_local_posts', JSON.stringify(localPosts));
        renderTimeline(localPosts);
      }
    }

    function renderTimeline(posts) {
      const container = document.getElementById('timeline-container');
      if (!posts || posts.length === 0) {
        container.innerHTML = '<div class="loading">NO TIMELINE DATA</div>';
        return;
      }
      container.innerHTML = '';
      posts.forEach((post, pIdx) => {
        const card = document.createElement('div');
        card.className = 'post-card';
        
        let imageHtml = (post.image && post.image.trim() !== "") 
          ? `<img src="${post.image}" class="gallery-image" style="border-radius:12px; margin-top:12px; cursor:pointer;" onclick="openModalWithImage('${post.image}', '${escapeHtml(post.date)}', '${escapeHtml(post.text)}')">` 
          : '';
        
        let authorHtml = post.author ? `<span style="color:var(--accent-color); margin-right:8px; font-weight:bold;">${escapeHtml(post.author)}</span>` : '';

        const canDeletePost = currentUser && (currentUser.isAdmin || currentUser.name === post.author);
        const deletePostBtn = canDeletePost ? `<button class="btn-delete" onclick="deletePost(${pIdx})">削除</button>` : '';

        let commentsHtml = '';
        if (post.comments && post.comments.length > 0) {
          post.comments.forEach((comm, cIdx) => {
            const canDeleteComm = currentUser && (currentUser.isAdmin || currentUser.name === comm.author);
            const deleteCommBtn = canDeleteComm ? `<button class="btn-delete" onclick="deleteComment(${pIdx}, ${cIdx})">削除</button>` : '';

            commentsHtml += `
              <div class="comment-item">
                <div class="comment-header">
                  <span><b style="color:var(--accent-color);">${escapeHtml(comm.author)}</b></span>
                  <div>
                    <span style="margin-right:6px;">${escapeHtml(comm.date)}</span>
                    ${deleteCommBtn}
                  </div>
                </div>
                <div style="word-break:break-all; font-weight:300; line-height:1.4;">${escapeHtml(comm.text)}</div>
              </div>
            `;
          });
        }

        card.innerHTML = `
          <div class="post-header">
            <span>${authorHtml}${escapeHtml(post.date || '')}</span>
            ${deletePostBtn}
          </div>
          <div style="font-size:0.85rem; font-weight:300; line-height:1.6; word-break:break-all;">${escapeHtml(post.text || '')}</div>
          ${imageHtml}
          
          <div class="comments-section">
            <div style="font-size:0.6rem; color:var(--text-muted); margin-bottom:8px; letter-spacing:1px;">REPLIES</div>
            <div id="comments-list-${pIdx}">${commentsHtml}</div>
            
            <div style="margin-top: 10px; display: flex; gap: 6px;">
              <input type="text" id="comment-text-${pIdx}" placeholder="返信を入力..." style="margin-bottom:0; font-size:0.75rem; padding:8px 12px;" onkeypress="if(event.key === 'Enter') addComment(${pIdx})">
              <button onclick="playSound('action'); addComment(${pIdx})" style="width: auto; padding: 8px 14px; font-size:0.65rem;">REPLY</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function addComment(pIdx) {
      const textInput = document.getElementById(`comment-text-${pIdx}`);
      const text = textInput.value.trim();
      if (!text) return;

      const author = currentUser ? currentUser.name : 'ゲスト';
      const now = new Date();
      const dateStr = `${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

      fetch('posts.json')
        .then(res => res.json())
        .then(jsonPosts => {
          let localPosts = JSON.parse(localStorage.getItem('o_asis_local_posts') || '[]');
          if (localPosts.length === 0) localPosts = jsonPosts;
          if (!localPosts[pIdx].comments) localPosts[pIdx].comments = [];
          localPosts[pIdx].comments.push({ author: author, date: dateStr, text: text });
          localStorage.setItem('o_asis_local_posts', JSON.stringify(localPosts));
          renderTimeline(localPosts);
        })
        .catch(() => {
          let localPosts = JSON.parse(localStorage.getItem('o_asis_local_posts') || '[]');
          if (localPosts[pIdx]) {
            if (!localPosts[pIdx].comments) localPosts[pIdx].comments = [];
            localPosts[pIdx].comments.push({ author: author, date: dateStr, text: text });
            localStorage.setItem('o_asis_local_posts', JSON.stringify(localPosts));
            renderTimeline(localPosts);
          }
        });
    }

    // --- ギャラリー ---
    function loadGallery() {
      fetch('gallery.json').then(res => res.json()).then(items => {
        const container = document.getElementById('gallery-container');
        if (!items) return;
        container.innerHTML = '';
        const grid = document.createElement('div');
        grid.className = 'gallery-grid';
        items.forEach(item => {
          const div = document.createElement('div');
          div.className = 'gallery-item';
          div.innerHTML = `<img src="${item.image}" class="gallery-image"><div class="gallery-info">${item.title || ''}</div>`;
          div.onclick = () => { openModalWithImage(item.image, item.title || '', item.description || ''); };
          grid.appendChild(div);
        });
        container.appendChild(grid);
      }).catch(() => {});
    }

    function openModalWithImage(imgSrc, dateStr, textStr) {
      playSound('modal');
      document.getElementById('modal-img').src = imgSrc;
      document.getElementById('modal-title').innerText = dateStr;
      document.getElementById('modal-desc').innerText = textStr;
      document.getElementById('image-modal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('image-modal').classList.remove('show');
    }

    // --- LINE風 1対1トーク機能 (修正版: CORS・POST対策) ---
    function initTalkTab() {
      const adminSelector = document.getElementById('admin-talk-selector');
      if (currentUser && currentUser.isAdmin) {
        adminSelector.style.display = 'block';
        fetchAdminUserList();
      } else {
        adminSelector.style.display = 'none';
      }
    }

    function fetchTalkMessages() {
      if (!currentUser) return;
      const targetUser = currentUser.isAdmin ? activeAdminChatUser : currentUser.name;
      const container = document.getElementById('chat-messages');

      if (currentUser.isAdmin && !targetUser) {
        container.innerHTML = '<div class="loading">上のセレクトボックスからトーク相手を選択してください。</div>';
        return;
      }

      fetch(`${DM_GAS_URL}?user=${encodeURIComponent(targetUser)}`)
        .then(res => res.json())
        .then(resData => {
          const data = resData.data || [];
          container.innerHTML = '';
          if (data.length === 0) {
            container.innerHTML = '<div class="loading">メッセージ履歴がありません。</div>';
            return;
          }

          data.forEach(msg => {
            const isMine = currentUser.isAdmin ? (msg.sender === 'admin') : (msg.sender !== 'admin');
            const bubble = document.createElement('div');
            bubble.className = `chat-bubble ${isMine ? 'mine' : 'other'}`;
            bubble.innerHTML = `
              <div>${escapeHtml(msg.message)}</div>
              <div class="chat-time">${escapeHtml(msg.timestamp || '')}</div>
            `;
            container.appendChild(bubble);
          });
          container.scrollTop = container.scrollHeight;
        })
        .catch(() => {
          container.innerHTML = '<div class="loading">通信に失敗しました。</div>';
        });
    }

    function fetchAdminUserList() {
      fetch(`${DM_GAS_URL}?action=getUserList`)
        .then(res => res.json())
        .then(resData => {
          const select = document.getElementById('user-chat-select');
          const users = resData.users || [];
          select.innerHTML = '<option value="">トーク相手を選択...</option>';
          users.forEach(u => {
            const opt = document.createElement('option');
            opt.value = u;
            opt.textContent = u;
            if (u === activeAdminChatUser) opt.selected = true;
            select.appendChild(opt);
          });
        })
        .catch(() => {});
    }

    function changeAdminChatTarget() {
      activeAdminChatUser = document.getElementById('user-chat-select').value;
      fetchTalkMessages();
    }

    function sendChatMessage(e) {
      e.preventDefault();
      const input = document.getElementById('chat-reply-input');
      const message = input.value.trim();
      if (!message || !currentUser) return;

      const targetUser = currentUser.isAdmin ? activeAdminChatUser : currentUser.name;
      if (currentUser.isAdmin && !targetUser) {
        alert('トーク相手を選択してください。');
        return;
      }

      const payload = {
        user: targetUser,
        name: currentUser.name,
        message: message,
        sender: currentUser.isAdmin ? 'admin' : 'user'
      };

      // CORS対策として mode: 'no-cors' を避け、リダイレクト対応のため text/plain で送信
      fetch(DM_GAS_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8',
        },
        body: JSON.stringify(payload)
      })
      .then(() => {
        input.value = '';
        playSound('action');
        // 少し遅延させてGASの書き込み完了後に再取得
        setTimeout(fetchTalkMessages, 600);
      })
      .catch((err) => {
        console.error(err);
        alert('送信に失敗しました。');
      });
    }

    document.addEventListener('DOMContentLoaded', initSession);
  </script>
</body>
</html>
