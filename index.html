<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O-ASIS // VIRTUAL NETWORK SPACE</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap');

    :root {
      --bg-gradient: radial-gradient(circle at 50% -20%, #1a1b35 0%, #090a10 60%, #030407 100%);
      --glass-bg: rgba(18, 20, 32, 0.45);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-border-hover: rgba(168, 85, 247, 0.3);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --primary-gradient: linear-gradient(135deg, #818cf8 0%, #c084fc 50%, #f472b6 100%);
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 32px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: -30%;
      left: 20%;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.07) 0%, rgba(168, 85, 247, 0.03) 40%, transparent 70%);
      z-index: -1;
      pointer-events: none;
      filter: blur(60px);
      animation: floatOrb 12s ease-in-out infinite alternate;
    }

    @keyframes floatOrb {
      0% { transform: translate(-10%, -10%) scale(1); }
      100% { transform: translate(10%, 15%) scale(1.1); }
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    h1 {
      font-size: 1.8rem;
      letter-spacing: 6px;
      margin: 0 0 6px 0;
      font-weight: 500;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 25px rgba(192, 132, 252, 0.25));
    }

    .subtitle {
      font-size: 0.7rem;
      letter-spacing: 4px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 300;
    }

    /* タブメニュー（4つ対応） */
    .tab-container {
      display: flex;
      width: 100%;
      max-width: 520px;
      margin-bottom: 24px;
      background: rgba(10, 11, 18, 0.6);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 5px;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .tab-btn {
      flex: 1;
      padding: 10px 4px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      font-size: 0.7rem;
      letter-spacing: 1px;
      border-radius: 10px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .tab-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.03);
    }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
    }

    .card {
      background: var(--glass-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 520px;
      margin-bottom: 20px;
      box-sizing: border-box;
      display: none;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--text-muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--glass-border), transparent);
    }
    
    input, textarea {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 12px;
      border: 1px solid var(--glass-border);
      background: rgba(5, 6, 10, 0.6);
      color: var(--text-main);
      font-family: inherit;
      border-radius: 12px;
      box-sizing: border-box;
      font-size: 0.85rem;
      transition: all 0.25s ease;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: rgba(192, 132, 252, 0.5);
      background: rgba(5, 6, 10, 0.85);
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.15), inset 0 2px 4px rgba(0, 0, 0, 0.2);
    }

    button {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.08);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: 2px;
      font-size: 0.75rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    button:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 6px 24px rgba(168, 85, 247, 0.25);
      transform: translateY(-1px);
    }

    /* ギャラリー用グリッドレイアウト */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .gallery-item {
      background: rgba(14, 16, 26, 0.6);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .gallery-item:hover {
      border-color: var(--glass-border-hover);
      box-shadow: 0 8px 24px rgba(168, 85, 247, 0.2);
      transform: translateY(-2px);
    }

    .gallery-image {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
    }

    .gallery-info {
      padding: 10px;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      letter-spacing: 1px;
    }

    .post-card {
      background: rgba(14, 16, 26, 0.5);
      border: 1px solid var(--glass-border);
      border-left: 2px solid #c084fc;
      padding: 16px;
      margin-top: 14px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    .comment-card {
      background: rgba(8, 10, 16, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-left: 2px solid #818cf8;
      padding: 10px 12px;
      margin-top: 8px;
      border-radius: 10px;
      font-size: 0.8rem;
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .post-text {
      font-size: 0.9rem;
      word-break: break-all;
      color: #e5e7eb;
      line-height: 1.6;
      font-weight: 300;
    }

    .post-image {
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      margin-top: 12px;
    }

    .comment-section {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .comment-form {
      margin-top: 10px;
    }

    .comment-form input, .comment-form textarea {
      font-size: 0.75rem;
      padding: 8px 10px;
      margin-bottom: 6px;
    }

    .comment-form button {
      padding: 8px;
      font-size: 0.7rem;
    }

    .link-item {
      display: block;
      padding: 16px;
      margin-bottom: 10px;
      background: rgba(14, 16, 26, 0.5);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      color: var(--text-main);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.85rem;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-sizing: border-box;
    }

    .link-item:hover {
      background: rgba(25, 28, 45, 0.7);
      border-color: rgba(192, 132, 252, 0.4);
      box-shadow: 0 8px 24px rgba(168, 85, 247, 0.15);
      transform: translateY(-1px);
    }

    .loading {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
      padding: 24px;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

  <header>
    <h1>O-ASIS</h1>
    <div class="subtitle">Virtual Network Space</div>
  </header>

  <!-- タブメニュー（4つ） -->
  <div class="tab-container">
    <button class="tab-btn active" onclick="switchTab('timeline', event)">TIMELINE</button>
    <button class="tab-btn" onclick="switchTab('status', event)">STATUS</button>
    <button class="tab-btn" onclick="switchTab('gallery', event)">GALLERY</button>
    <button class="tab-btn" onclick="switchTab('contact', event)">CONTACT</button>
  </div>

  <!-- 1. タイムラインタブ -->
  <div id="tab-timeline" class="card active">
    <div class="section-title">Timeline</div>
    <div id="timeline-container">
      <div class="loading">ESTABLISHING LINK...</div>
    </div>
  </div>

  <!-- 2. ステータスタブ -->
  <div id="tab-status" class="card">
    <div class="section-title">O-ji's Status</div>
    <div id="status-container" style="white-space: pre-wrap; font-size: 0.85rem; font-weight: 300; line-height: 1.6; color: #e5e7eb;">INITIALIZING...</div>
  </div>

  <!-- 3. ギャラリータブ -->
  <div id="tab-gallery" class="card">
    <div class="section-title">Gallery Archive</div>
    <div id="gallery-container">
      <div class="loading">LOADING ASSETS...</div>
    </div>
  </div>

  <!-- 4. 連絡先タブ -->
  <div id="tab-contact" class="card">
    <div class="section-title">Contact</div>
    <a href="mailto:deadshotdaiki@gmail.com" class="link-item" onclick="playAudio('click')">
      <span>✉️ Send Mail</span>
      <span style="font-size:0.75rem; color:var(--text-muted); display:block; font-weight:300; margin-top:4px;">deadshotdaiki@gmail.com</span>
    </a>
    <div class="link-item" onclick="copyDiscord(); playAudio('click');" style="cursor: pointer;">
      <span>💬 Copy Discord ID</span>
      <span style="font-size:0.75rem; color:var(--text-muted); display:block; font-weight:300; margin-top:4px;">vamos_cantar (Click to Copy)</span>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbycDeI_m_ERlsdFSTDF7S4Dl1agQnwzfxQgrEw9OciBmlc4wrvX8rRiAAzoUEJtvNLlBw/exec";

    let audioCtx = null;
    function playAudio(type) {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'tab') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880.00, audioCtx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.08);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.08);
        } else if (type === 'click') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(220, audioCtx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.05);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.05);
        }
      } catch (e) {}
    }

    function switchTab(tabName, event) {
      playAudio('tab');
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.card').forEach(card => card.classList.remove('active'));

      event.currentTarget.classList.add('active');
      document.getElementById('tab-' + tabName).classList.add('active');
    }

    function copyDiscord() {
      navigator.clipboard.writeText('vamos_cantar').then(() => {
        alert('Discord ID [ vamos_cantar ] をコピーしました。');
      });
    }

    fetch('status.txt')
      .then(res => res.text())
      .then(text => {
        const el = document.getElementById('status-container');
        if (el) el.innerText = text;
      }).catch(() => {});

    // ギャラリーデータの読み込み（gallery.json を読み込み表示）
    function loadGallery() {
      fetch('gallery.json')
        .then(res => res.json())
        .then(items => {
          const container = document.getElementById('gallery-container');
          if (!container) return;
          container.innerHTML = '';
          if (!items || items.length === 0) {
            container.innerHTML = '<div class="loading">NO ASSETS FOUND</div>';
            return;
          }
          const grid = document.createElement('div');
          grid.className = 'gallery-grid';
          items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'gallery-item';
            div.innerHTML = `
              <img src="${item.image}" class="gallery-image" alt="Artwork">
              <div class="gallery-info">${item.title || 'Untitled'}</div>
            `;
            grid.appendChild(div);
          });
          container.appendChild(grid);
        })
        .catch(() => {
          const container = document.getElementById('gallery-container');
          if (container) container.innerHTML = '<div class="loading">FAILED TO LOAD GALLERY</div>';
        });
    }

    function loadAllData() {
      loadGallery();
      if (!GAS_URL) return;
      fetch(GAS_URL)
        .then(res => res.json())
        .then(gasData => {
          fetch('posts.json')
            .then(res => res.json())
            .then(posts => {
              const timelineContainer = document.getElementById('timeline-container');
              if (!timelineContainer) return;
              timelineContainer.innerHTML = '';
              if (posts.length === 0) return;

              posts.forEach((post, index) => {
                const postId = post.id || 'post-' + index;
                const card = document.createElement('div');
                card.className = 'post-card';
                let imageHtml = post.image ? `<img src="${post.image}" class="post-image">` : '';
                
                const postComments = gasData.filter(item => item.postId === postId);
                let commentsHtml = '';
                postComments.forEach(c => {
                  commentsHtml += `
                    <div class="comment-card">
                      <div class="post-header"><span>${escapeHtml(c.name || 'ANONYMOUS')}</span><span>${escapeHtml(c.timestamp || '')}</span></div>
                      <div class="post-text">${escapeHtml(c.message || '')}</div>
                    </div>
                  `;
                });
                if (postComments.length === 0) {
                  commentsHtml = '<div style="font-size:0.7rem; color:var(--text-muted); margin-top:4px;">NO COMMENTS</div>';
                }

                card.innerHTML = `
                  <div class="post-header"><span>O-JI</span><span>${post.date}</span></div>
                  <div class="post-text">${post.text}</div>
                  ${imageHtml}
                  <div class="comment-section">
                    <div style="font-size: 0.75rem; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; letter-spacing: 1px;">COMMENTS</div>
                    ${commentsHtml}
                    <form class="comment-form" onsubmit="sendPost(event, '${postId}', 'name-${postId}', 'msg-${postId}')">
                      <input type="text" id="name-${postId}" placeholder="NAME (OPTIONAL)">
                      <textarea id="msg-${postId}" rows="1" placeholder="REPLY..." required></textarea>
                      <button type="submit" onclick="playAudio('click')">TRANSMIT</button>
                    </form>
                  </div>
                `;
                timelineContainer.appendChild(card);
              });
            }).catch(() => {
              const timelineContainer = document.getElementById('timeline-container');
              if (timelineContainer) timelineContainer.innerHTML = '<div class="loading">FAILED TO LOAD POSTS</div>';
            });
        })
        .catch(() => {
          const timelineContainer = document.getElementById('timeline-container');
          if (timelineContainer) timelineContainer.innerHTML = '<div class="loading">SYNC FAILED</div>';
        });
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>]/g, function (match) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[match];
      });
    }

    function sendPost(e, postId, nameId, msgId) {
      e.preventDefault();
      if (!GAS_URL) return;
      const nameInput = document.getElementById(nameId);
      const msgInput = document.getElementById(msgId);
      const name = nameInput ? nameInput.value : '';
      const message = msgInput ? msgInput.value : '';
      if (!message) return;

      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ name: name, message: message, postId: postId })
      })
      .then(res => res.json())
      .then(() => {
        if (msgInput) msgInput.value = '';
        if (nameInput) nameInput.value = '';
        loadAllData();
      })
      .catch(() => {
        alert('TRANSMISSION FAILED.');
      });
    }

    loadAllData();
  </script>
</body>
</html>
