<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O-ASIS - 仮想ネットワーク</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #050814;
            color: #f1f5f9;
            font-family: 'Zen Kaku Gothic New', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 40px 20px;
        }
        /* OASIS風のネットワーク背景グラデーション */
        body::before {
            content: '';
            position: fixed;
            width: 1000px;
            height: 1000px;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.07) 0%, rgba(138, 43, 226, 0.04) 40%, rgba(5, 8, 20, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 640px;
            text-align: center;
            animation: fadeIn 1.2s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .gateway-badge {
            display: inline-block;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            letter-spacing: 0.25em;
            color: #00f0ff;
            border: 1px solid rgba(0, 240, 255, 0.4);
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 25px;
            background: rgba(0, 240, 255, 0.05);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
        }
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(36px, 7vw, 64px);
            font-weight: 700;
            letter-spacing: 0.1em;
            color: #ffffff;
            margin-bottom: 8px;
            text-shadow: 0 0 25px rgba(0, 240, 255, 0.4), 0 0 50px rgba(138, 43, 226, 0.3);
        }
        .subtitle {
            font-size: 14px;
            color: #94a3b8;
            letter-spacing: 0.3em;
            margin-bottom: 35px;
            text-transform: uppercase;
        }
        /* ステータスボード */
        .status-board {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 20px;
            margin-bottom: 40px;
            border-radius: 8px;
            text-align: left;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
        }
        .status-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            letter-spacing: 0.2em;
            color: #00f0ff;
            margin-bottom: 6px;
        }
        .status-text {
            font-size: 14px;
            color: #e2e8f0;
            letter-spacing: 0.05em;
            line-height: 1.5;
        }
        /* タイムライン */
        .timeline {
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        .post-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-left: 3px solid #00f0ff;
            padding: 20px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .post-card:hover {
            border-color: rgba(0, 240, 255, 0.6);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
        }
        .post-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #64748b;
            margin-bottom: 12px;
            letter-spacing: 0.1em;
            font-family: 'Orbitron', sans-serif;
        }
        .post-header span:first-child {
            color: #00f0ff;
        }
        .post-text {
            font-size: 15px;
            color: #f1f5f9;
            line-height: 1.7;
            letter-spacing: 0.03em;
            white-space: pre-wrap;
            margin-bottom: 15px;
        }
        .post-image {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .loading {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="gateway-badge">VIRTUAL NETWORK</div>
        <h1>O-ASIS</h1>
        <p class="subtitle">Connected Space</p>
        
        <!-- 現在のステータス -->
        <div class="status-board">
            <div class="status-title">O-ji's Status</div>
            <div id="status-content" class="status-text">接続を確立中...</div>
        </div>

        <!-- タイムライン -->
        <div id="timeline-container" class="timeline">
            <div class="loading">ネットワークデータを同期中...</div>
        </div>
    </div>

    <script>
        // ステータス読み込み
        fetch('status.txt?' + new Date().getTime())
            .then(res => res.text())
            .then(text => {
                if (text.trim()) document.getElementById('status-content').innerText = text.trim();
            })
            .catch(() => { document.getElementById('status-content').innerText = 'シグナルなし。'; });

        // タイムライン読み込み
        fetch('posts.json?' + new Date().getTime())
            .then(res => res.json())
            .then(posts => {
                const container = document.getElementById('timeline-container');
                container.innerHTML = '';
                
                if (posts.length === 0) {
                    container.innerHTML = '<div class="loading">データがありません。</div>';
                    return;
                }

                posts.forEach(post => {
                    const card = document.createElement('div');
                    card.className = 'post-card';
                    
                    let imageHtml = '';
                    if (post.image && post.image.trim() !== '') {
                        imageHtml = `<img src="${post.image}" class="post-image" alt="network image">`;
                    }

                    card.innerHTML = `
                        <div class="post-header">
                            <span>O-ji</span>
                            <span>${post.date}</span>
                        </div>
                        <div class="post-text">${post.text}</div>
                        ${imageHtml}
                    `;
                    container.appendChild(card);
                });
            })
            .catch(() => {
                document.getElementById('timeline-container').innerHTML = '<div class="loading">同期に失敗しました。</div>';
            });
    </script>
</body>
</html>
