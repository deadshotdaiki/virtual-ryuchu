<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>バーチャル隆中 - 隠れ里の玄関</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Zen+Old+Mincho:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            font-family: 'Noto Serif JP', serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 40px 20px;
        }
        body::before {
            content: '';
            position: fixed;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.04) 0%, rgba(11, 15, 25, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 640px;
            text-align: center;
            animation: fadeIn 1.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .gateway-badge {
            display: inline-block;
            font-size: 13px;
            letter-spacing: 0.3em;
            color: #d4af37;
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 6px 18px;
            border-radius: 20px;
            margin-bottom: 25px;
            background: rgba(212, 175, 55, 0.03);
        }
        h1 {
            font-family: 'Zen Old Mincho', serif;
            font-size: clamp(32px, 6vw, 56px);
            font-weight: 700;
            letter-spacing: 0.15em;
            color: #f8fafc;
            margin-bottom: 12px;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }
        .subtitle {
            font-size: 15px;
            color: #94a3b8;
            letter-spacing: 0.2em;
            margin-bottom: 35px;
            font-weight: 300;
        }
        /* ステータスボード */
        .status-board {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 20px;
            margin-bottom: 40px;
            border-radius: 4px;
            text-align: left;
        }
        .status-title {
            font-size: 11px;
            letter-spacing: 0.2em;
            color: #d4af37;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .status-text {
            font-size: 14px;
            color: #cbd5e1;
            letter-spacing: 0.08em;
            line-height: 1.5;
        }
        /* タイムライン（呟きエリア） */
        .timeline {
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        .post-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-left: 2px solid #d4af37;
            padding: 20px;
            border-radius: 4px;
            transition: border-color 0.3s;
        }
        .post-card:hover {
            border-color: rgba(212, 175, 55, 0.4);
        }
        .post-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #64748b;
            margin-bottom: 12px;
            letter-spacing: 0.1em;
        }
        .post-text {
            font-size: 15px;
            color: #e2e8f0;
            line-height: 1.7;
            letter-spacing: 0.05em;
            white-space: pre-wrap;
            margin-bottom: 15px;
        }
        .post-image {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 3px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .loading {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="gateway-badge">秘境関所</div>
        <h1>バーチャル隆中</h1>
        <p class="subtitle">静寂と創造の隠れ里</p>
        
        <!-- 現在のステータス -->
        <div class="status-board">
            <div class="status-title">Current Status</div>
            <div id="status-content" class="status-text">静寂を読み込み中...</div>
        </div>

        <!-- タイムライン -->
        <div id="timeline-container" class="timeline">
            <div class="loading">記憶を呼び起こしています...</div>
        </div>
    </div>

    <script>
        // ステータス読み込み
        fetch('status.txt?' + new Date().getTime())
            .then(res => res.text())
            .then(text => {
                if (text.trim()) document.getElementById('status-content').innerText = text.trim();
            })
            .catch(() => { document.getElementById('status-content').innerText = '気配なし。'; });

        // 呟き（タイムライン）読み込み
        fetch('posts.json?' + new Date().getTime())
            .then(res => res.json())
            .then(posts => {
                const container = document.getElementById('timeline-container');
                container.innerHTML = '';
                
                if (posts.length === 0) {
                    container.innerHTML = '<div class="loading">まだ呟きはありません。</div>';
                    return;
                }

                posts.forEach(post => {
                    const card = document.createElement('div');
                    card.className = 'post-card';
                    
                    let imageHtml = '';
                    if (post.image && post.image.trim() !== '') {
                        imageHtml = `<img src="${post.image}" class="post-image" alt="post image">`;
                    }

                    card.innerHTML = `
                        <div class="post-header">
                            <span>主の記録</span>
                            <span>${post.date}</span>
                        </div>
                        <div class="post-text">${post.text}</div>
                        ${imageHtml}
                    `;
                    container.appendChild(card);
                });
            })
            .catch(() => {
                document.getElementById('timeline-container').innerHTML = '<div class="loading">記録の読み込みに失敗しました。</div>';
            });
    </script>
</body>
</html>
