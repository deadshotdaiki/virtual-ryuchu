<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O-ASIS // VIRTUAL NETWORK SPACE</title>
  <style>
    body {
      background-color: #121212;
      color: #d4d4d4;
      font-family: "Courier New", Courier, monospace, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      letter-spacing: 1px;
    }
    h1 {
      font-size: 1.6rem;
      letter-spacing: 4px;
      margin-bottom: 2px;
      color: #ffffff;
      text-transform: uppercase;
    }
    .subtitle {
      font-size: 0.7rem;
      letter-spacing: 3px;
      color: #777777;
      margin-bottom: 20px;
      text-transform: uppercase;
    }
    /* タブメニュー（ニーア風シネマティック枠） */
    .tab-container {
      display: flex;
      width: 100%;
      max-width: 500px;
      margin-bottom: 16px;
      gap: 4px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px;
      background: #1a1a1a;
      border: 1px solid #444444;
      color: #888888;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      font-size: 0.75rem;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #d4d4d4;
      color: #121212;
      border-color: #d4d4d4;
    }
    .card {
      background: #181818;
      border: 1px solid #333333;
      padding: 16px;
      width: 100%;
      max-width: 500px;
      margin-bottom: 16px;
      box-sizing: border-box;
      display: none;
    }
    .card.active {
      display: block;
    }
    .section-title {
      font-size: 0.8rem;
      font-weight: bold;
      margin-bottom: 12px;
      color: #aaaaaa;
      text-transform: uppercase;
      border-bottom: 1px solid #333333;
      padding-bottom: 4px;
    }
    input, textarea {
      width: 100%;
      padding: 8px;
      margin-bottom: 8px;
      border: 1px solid #444444;
      background: #0d0d0d;
      color: #ffffff;
      font-family: inherit;
      box-sizing: border-box;
      font-size: 0.85rem;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #d4d4d4;
    }
    button {
      width: 100%;
      padding: 8px;
      background: #222222;
      color: #ffffff;
      border: 1px solid #555555;
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 0.8rem;
      transition: background 0.2s;
    }
    button:hover {
      background: #d4d4d4;
      color: #121212;
    }
    .post-card {
      background: #141414;
      border-left: 3px solid #d4d4d4;
      border-top: 1px solid #282828;
      border-right: 1px solid #282828;
      border-bottom: 1px solid #282828;
      padding: 12px;
      margin-top: 12px;
    }
    .comment-card {
      background: #101010;
      border-left: 3px solid #666666;
      border-top: 1px solid #222222;
      border-right: 1px solid #222222;
      border-bottom: 1px solid #222222;
      padding: 8px 10px;
      margin-top: 6px;
      font-size: 0.85rem;
    }
    .post-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: #777777;
      margin-bottom: 6px;
    }
    .post-text {
      font-size: 0.9rem;
      word-break: break-all;
      color: #cccccc;
    }
    .post-image {
      width: 100%;
      border: 1px solid #333333;
      margin-top: 8px;
    }
    .comment-section {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dotted #333333;
    }
    .comment-form {
      margin-top: 8px;
    }
    .comment-form input, .comment-form textarea {
      font-size: 0.75rem;
      padding: 6px;
      margin-bottom: 4px;
    }
    .comment-form button {
      padding: 6px;
      font-size: 0.75rem;
    }
    .link-item {
      display: block;
      padding: 10px;
      margin-bottom: 8px;
      background: #141414;
      border: 1px solid #333333;
      color: #cccccc;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .link-item:hover {
      background: #d4d4d4;
      color: #121212;
      border-color: #d4d4d4;
    }
    .loading {
      text-align: center;
      color: #666666;
      font-size: 0.8rem;
      padding: 10px;
    }
  </style>
</head>
<body>

  <h1>O-ASIS</h1>
  <div class="subtitle">// VIRTUAL NETWORK SPACE</div>

  <!-- タブ切り替えボタン -->
  <div class="tab-container">
    <div class="tab-btn active" onclick="switchTab('timeline', event)">Timeline</div>
    <div class="tab-btn" onclick="switchTab('status', event)">Status</div>
    <div class="tab-btn" onclick="switchTab('contact', event)">Contact</div>
  </div>

  <!-- 1. タイムラインタブ -->
  <div id="tab-timeline" class="card active">
    <div class="section-title">Timeline</div>
    <div id="timeline-container">
      <div class="loading">CONNECTING...</div>
    </div>
  </div>

  <!-- 2. ステータスタブ -->
  <div id="tab-status" class="card">
    <div class="section-title">O-ji's Status</div>
    <div id="status-container" style="white-space: pre-wrap;">ESTABLISHING LINK...</div>
  </div>

  <!-- 3. 連絡先タブ -->
  <div id="tab-contact" class="card">
    <div class="section-title">Contact</div>
    <a href="mailto:deadshotdaiki@gmail.com" class="link-item">
      [ MAIL ] Send Message <span style="font-size:0.7rem; color:#777777; display:block; font-weight:normal;">deadshotdaiki@gmail.com</span>
    </a>
    <div class="link-item" onclick="copyDiscord()" style="cursor: pointer;">
      [ DISCORD ] Copy ID <span style="font-size:0.7rem; color:#777777; display:block; font-weight:normal;">vamos_cantar (Click to Copy)</span>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbycDeI_m_ERlsdFSTDF7S4Dl1agQnwzfxQgrEw9OciBmlc4wrvX8rRiAAzoUEJtvNLlBw/exec";

    function switchTab(tabName, event) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.card').forEach(card => card.classList.remove('active'));

      event.currentTarget.classList.add('active');
      document.getElementById('tab-' + tabName).classList.add('active');
    }

    function copyDiscord() {
      navigator.clipboard.writeText('vamos_cantar').then(() => {
        alert('Discord ID [ vamos_cantar ] Copied.');
      });
    }

    fetch('status.txt')
      .then(res => res.text())
      .then(text => {
        const el = document.getElementById('status-container');
        if (el) el.innerText = text;
      }).catch(() => {});

    function loadAllData() {
      if (!GAS_URL) return;
      fetch(GAS_URL)
        .then(res => res.json())
        .then(gasData => {
          fetch('posts.json')
            .then(res => res.json())
            .then(posts => {
              const timelineContainer = document.getElementById('timeline-container');
              if (!timelineContainer) return;
              timelineContainer.innerHTML = '';
              if (posts.length === 0) return;

              posts.forEach((post, index) => {
                const postId = post.id || 'post-' + index;
                const card = document.createElement('div');
                card.className = 'post-card';
                let imageHtml = post.image ? `<img src="${post.image}" class="post-image">` : '';
                
                const postComments = gasData.filter(item => item.postId === postId);
                let commentsHtml = '';
                postComments.forEach(c => {
                  commentsHtml += `
                    <div class="comment-card">
                      <div class="post-header"><span>${escapeHtml(c.name || 'ANONYMOUS')}</span><span>${escapeHtml(c.timestamp || '')}</span></div>
                      <div class="post-text">${escapeHtml(c.message || '')}</div>
                    </div>
                  `;
                });
                if (postComments.length === 0) {
                  commentsHtml = '<div style="font-size:0.7rem; color:#555555; margin-top:4px;">NO COMMENTS</div>';
                }

                card.innerHTML = `
                  <div class="post-header"><span>O-JI</span><span>${post.date}</span></div>
                  <div class="post-text">${post.text}</div>
                  ${imageHtml}
                  <div class="comment-section">
                    <div style="font-size: 0.75rem; font-weight: bold; color: #888888; margin-bottom: 4px;">COMMENTS</div>
                    ${commentsHtml}
                    <form class="comment-form" onsubmit="sendPost(event, '${postId}', 'name-${postId}', 'msg-${postId}')">
                      <input type="text" id="name-${postId}" placeholder="NAME (OPTIONAL)">
                      <textarea id="msg-${postId}" rows="1" placeholder="REPLY..." required></textarea>
                      <button type="submit">TRANSMIT</button>
                    </form>
                  </div>
                `;
                timelineContainer.appendChild(card);
              });
            }).catch(() => {
              const timelineContainer = document.getElementById('timeline-container');
              if (timelineContainer) timelineContainer.innerHTML = '<div class="loading">FAILED TO LOAD POSTS</div>';
            });
        })
        .catch(() => {
          const timelineContainer = document.getElementById('timeline-container');
          if (timelineContainer) timelineContainer.innerHTML = '<div class="loading">SYNC FAILED</div>';
        });
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>]/g, function (match) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[match];
      });
    }

    function sendPost(e, postId, nameId, msgId) {
      e.preventDefault();
      if (!GAS_URL) return;
      const nameInput = document.getElementById(nameId);
      const msgInput = document.getElementById(msgId);
      const name = nameInput ? nameInput.value : '';
      const message = msgInput ? msgInput.value : '';
      if (!message) return;

      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ name: name, message: message, postId: postId })
      })
      .then(res => res.json())
      .then(() => {
        if (msgInput) msgInput.value = '';
        if (nameInput) nameInput.value = '';
        loadAllData();
      })
      .catch(() => {
        alert('TRANSMISSION FAILED.');
      });
    }

    loadAllData();
  </script>
</body>
</html>
